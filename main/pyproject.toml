[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beatlight-dmx"
version = "0.41.0"
description = "Pixel Studio, WS2812 via ESP32 USB e sincronização musical — BEATLIGHT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "PySide6>=6.7,<7", "pyserial==3.5", "PyAudioWPatch>=0.2.12.6,<0.3; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
link = ["aalink==0.2.3"]

[project.scripts]
beatlight = "beatlight.__main__:main"
beatlight-replay = "beatlight.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/beatlight" = ["beatlight/beatlight_pixel_studio.html"]
"share/beatlight/docs" = [
    "docs/esp32-ws2812-usb.md", "docs/resultado-esp32-v0.22.json", "docs/validacao.md",
    "docs/pixel-studio.md", "docs/conexoes-fitas.md", "docs/confiabilidade.md", "docs/apresentacao-leve.md",
    "docs/resultado-pixel-presentation-v0.26.0.json", "docs/resultado-pixel-usb-v0.26.0.json",
    "docs/kicks.md", "docs/kicks-baixo.md", "docs/grid-kicks.md", "docs/drop-detection.md", "docs/grade-audio-estavel.md",
    "docs/resultado-grade-audio-v0.27.0.json", "docs/resultado-grade-audio-v0.28.0.json", "docs/resultado-grade-audio-ui-v0.28.0.json",
    "docs/resultado-kick-masking-v0.26.0.json", "docs/resultado-kick-masking-v0.27.0.json",
    "docs/resultado-kick-masking-ui-v0.27.0.json", "docs/avaliacao-recomendacoes-drop-v0.23.md",
