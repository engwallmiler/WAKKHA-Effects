[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps = fastled/FastLED@3.10.3
monitor_speed = 921600
upload_speed = 460800
build_flags = -DCORE_DEBUG_LEVEL=0 -DFASTLED_RMT_MAX_CHANNELS=8 -DFASTLED_RMT_MEM_BLOCKS=2
build_src_filter = +<*> -<.pio/> -<dist/>
