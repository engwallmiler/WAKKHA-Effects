[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "beatlight-dmx"
version = "0.22.0"
description = "Pixel Studio, WS2812 via ESP32 USB e sincronização musical — BEATLIGHT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2", "PySide6>=6.7,<7", "pyserial==3.5", "PyAudioWPatch>=0.2.12.6,<0.3; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
link = ["aalink==0.2.3"]

[project.scripts]
beatlight = "beatlight.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/beatlight" = ["beatlight/beatlight_pixel_studio.html"]
"share/beatlight/docs" = ["docs/esp32-ws2812-usb.md", "docs/resultado-esp32-v0.22.json", "docs/validacao.md"]
"share/beatlight/examples" = ["examples/ws2812-300.json"]
"share/beatlight/firmware/beatlight_esp32" = ["firmware/beatlight_esp32/beatlight_esp32.ino", "firmware/beatlight_esp32/protocol.h", "firmware/beatlight_esp32/platformio.ini"]
"share/beatlight/firmware/beatlight_esp32/dist" = ["firmware/beatlight_esp32/dist/beatlight-wroom32-ws2812-300-v0.22.0.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
