"share/beatlight/firmware/beatlight_esp32/dist" = ["firmware/beatlight_esp32/dist/beatlight-wroom32-ws2812-300-v0.22.0.bin", "firmware/beatlight_esp32/dist/beatlight-wroom32-ws2812-4x300-v0.37.0.bin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
